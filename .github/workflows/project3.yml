name: Project 3 tests
on:
  push:
    paths:
      - 'project3/**'
      - '.github/workflows/project3.yml'
  pull_request:
    paths:
      - 'project3/**'
      - '.github/workflows/project3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        bits: [32, 64]
    defaults:
      run:
        working-directory: project3
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit development libraries
        if: matrix.bits == 32
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - name: Regression tests and benchmarks
        run: |
          make CC=${{ matrix.compiler }} CFLAGS="-m${{ matrix.bits }} -O2 -g -std=c11 -Wall -Wextra -Werror" test benchmarks
          ./benchmark/test
          ./benchmark/mtest
      - name: Address and undefined behavior checks
        if: matrix.bits == 64
        run: make CC=${{ matrix.compiler }} CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all" test
  thread-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: project3
    steps:
      - uses: actions/checkout@v4
      - name: Thread sanitizer
        run: make CC=gcc CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=thread" test
